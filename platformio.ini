[platformio]
default_envs = esp32_wroom_ws2812_16x16, esp32_wroom_ws2812_22x22, matrixportal_s3_hub75_64x64

[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/pio_prebuild.py
lib_ldf_mode = deep+

[wroom]
board = esp32dev
board_build.partitions = partitions-wroom.csv
build_flags =
  -DMATRIX_PROFILE_WS2812=1
  -DWS2812_DATA_PIN=22
  -DWS2812_ROTATION=0
lib_deps =
  adafruit/Adafruit NeoMatrix@1.3.3
  adafruit/Adafruit NeoPixel@1.13.0
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  bblanchon/ArduinoJson@6.21.5

[env:esp32_wroom_ws2812_16x16]
extends = wroom
build_flags =
  ${wroom.build_flags}
  -DWS2812_MATRIX_WIDTH=16
  -DWS2812_MATRIX_HEIGHT=16

[env:esp32_wroom_ws2812_16x16_ota]
extends = env:esp32_wroom_ws2812_16x16
upload_protocol = espota

[env:esp32_wroom_ws2812_22x22]
extends = wroom
build_flags =
  ${wroom.build_flags}
  -DWS2812_MATRIX_WIDTH=22
  -DWS2812_MATRIX_HEIGHT=22

[env:esp32_wroom_ws2812_22x22_ota]
extends = env:esp32_wroom_ws2812_22x22
upload_protocol = espota

[env:matrixportal_s3_hub75_64x64]
board = adafruit_matrixportal_esp32s3
build_flags =
  -DMATRIX_PROFILE_HUB75=1
  -DS3_LCD_DIV_NUM=8
  -DNO_CIE1931
lib_deps =
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  bblanchon/ArduinoJson@6.21.5

[env:matrixportal_s3_hub75_64x64_ota]
extends = env:matrixportal_s3_hub75_64x64
upload_protocol = espota
