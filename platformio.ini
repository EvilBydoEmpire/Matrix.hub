[platformio]
default_envs = matrixportal_s3_hub75
src_dir = src

[env:matrixportal_s3_hub75]
platform = espressif32@7.0.1
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -DMATRIX_PROFILE_HUB75=1
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src
lib_deps =
  adafruit/Adafruit Protomatter@1.7.1
  adafruit/Adafruit GFX Library@1.12.6
  bblanchon/ArduinoJson@6.21.5

[env:esp32_wroom_ws2812_16x16]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
board_build.partitions = partitions/esp32_wroom_4mb_ota_littlefs.csv
board_build.filesystem = littlefs
build_flags =
  -DMATRIX_PROFILE_WS2812=1
  -DWS2812_MATRIX_WIDTH=16
  -DWS2812_MATRIX_HEIGHT=16
  -DWS2812_DATA_PIN=22
  -DWS2812_ROTATION=0
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src
lib_deps =
  adafruit/Adafruit NeoMatrix@1.3.3
  adafruit/Adafruit NeoPixel@1.13.0
  adafruit/Adafruit GFX Library@1.12.6
  bblanchon/ArduinoJson@6.21.5

[env:esp32_wroom_ws2812_16x16_ota]
extends = env:esp32_wroom_ws2812_16x16
upload_protocol = espota
upload_port = matrix-16.local

[env:esp32_wroom_ws2812_22x22]
extends = env:esp32_wroom_ws2812_16x16
build_flags =
  -DMATRIX_PROFILE_WS2812=1
  -DWS2812_MATRIX_WIDTH=22
  -DWS2812_MATRIX_HEIGHT=22
  -DWS2812_DATA_PIN=22
  -DWS2812_ROTATION=0
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src

[env:esp32_wroom_ws2812_22x22_ota]
extends = env:esp32_wroom_ws2812_22x22
upload_protocol = espota
upload_port = matrix-22.local

[env:matrixportal_s3_hub75_4bit_test]
extends = env:matrixportal_s3_hub75
build_flags =
  ${env:matrixportal_s3_hub75.build_flags}
  -DMATRIX_COLOR_DEPTH=4

[env:matrixportal_s3_hub75_3bit_test]
extends = env:matrixportal_s3_hub75
build_flags =
  ${env:matrixportal_s3_hub75.build_flags}
  -DMATRIX_COLOR_DEPTH=3
  -DMATRIX_LOW_LIGHT_DITHER=0

[env:matrixportal_s3_hub75_4bit_ota]
extends = env:matrixportal_s3_hub75_4bit_test
upload_protocol = espota
upload_port = matrix-64.local

[env:matrixportal_s3_hub75_4bit_20mhz]
extends = env:matrixportal_s3_hub75_4bit_ota
extra_scripts = post:tools/protomatter_timing.py
build_flags =
  ${env:matrixportal_s3_hub75_4bit_test.build_flags}
  -DLCD_CLK_PRESCALE=8
  -DMATRIX_TIMING_EXPERIMENT=1

[env:matrixportal_s3_hub75_4bit_20mhz_usb]
extends = env:matrixportal_s3_hub75_4bit_20mhz
upload_protocol = esptool

[env:matrixportal_s3_hub75_3bit_ota]
extends = env:matrixportal_s3_hub75_3bit_test
upload_protocol = espota
upload_port = matrix-64.local

[env:matrixportal_s3_hub75_dma_4bit_usb]
extends = env:matrixportal_s3_hub75
build_flags =
  ${env:matrixportal_s3_hub75.build_flags}
  -DMATRIX_HUB75_DMA=1
  -DMATRIX_COLOR_DEPTH=4
  -DMATRIX_LOW_LIGHT_DITHER=0
  -DS3_LCD_DIV_NUM=8
  -DNO_CIE1931
lib_deps =
  https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7
  adafruit/Adafruit GFX Library@1.12.6
  bblanchon/ArduinoJson@6.21.5

[env:matrixportal_s3_hub75_dma_4bit_ota]
extends = env:matrixportal_s3_hub75_dma_4bit_usb
upload_protocol = espota
upload_port = matrix-64.local

[env:matrixportal_s3_hub75_3bit_no_ota_measure]
extends = env:matrixportal_s3_hub75_3bit_test
build_flags =
  ${env:matrixportal_s3_hub75_3bit_test.build_flags}
  -DMATRIX_ENABLE_OTA=0
